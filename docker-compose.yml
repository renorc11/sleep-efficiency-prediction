version: "3.9"
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./ml/artifacts:/ml/artifacts
      - ./backend:/app
    environment:
      - PYTHONPATH=/app
      - ARTIFACTS_DIR=/ml/artifacts
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
